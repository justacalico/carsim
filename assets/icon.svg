<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="220" fill="#0B0D10"/>
  <!-- cylinder bore -->
  <rect x="372" y="180" width="280" height="500" rx="16" fill="none" stroke="#4A5058" stroke-width="24"/>
  <!-- piston -->
  <rect x="392" y="330" width="240" height="120" rx="12" fill="#FF5A1F"/>
  <rect x="430" y="352" width="164" height="16" rx="8" fill="#0B0D10" opacity="0.35"/>
  <rect x="430" y="380" width="164" height="16" rx="8" fill="#0B0D10" opacity="0.35"/>
  <!-- connecting rod -->
  <line x1="512" y1="450" x2="640" y2="760" stroke="#8E959E" stroke-width="44" stroke-linecap="round"/>
  <!-- crank -->
  <circle cx="512" cy="780" r="150" fill="none" stroke="#4A5058" stroke-width="24"/>
  <circle cx="640" cy="760" r="34" fill="#8E959E"/>
  <!-- spark flash -->
  <path d="M 500 200 L 524 240 L 506 240 L 530 290" fill="none" stroke="#FFC966" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
