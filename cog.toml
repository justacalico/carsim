ignore_merge_commits = true
tag_prefix = "v"

pre_bump_hooks = [
  "sed -i -E 's/^version:.*/version: {{version}}/' pubspec.yaml",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "gitlab.com"
owner = "HttpAnimations"
repository = "carsim"

# Profile used by the CI auto-release job
[bump_profiles.ci]
pre_bump_hooks = [
  "sed -i -E 's/^version:.*/version: {{version}}/' pubspec.yaml",
]
